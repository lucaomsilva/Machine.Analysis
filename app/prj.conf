# --- Default Configuration of System ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# --- Shell's Configuration (CLI) ---
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="smid:~$ "

# --- Optimization of ESP32-S3 ---
CONFIG_FPU=y  # Float Point Unit

# --- Display Subsystem ---
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ST7796S=y

# --- Display Log Level (Helps debugging initialization) ---
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y
